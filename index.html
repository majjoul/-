<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأناشيد الإسلامية</title>
    <style>
        /* تنسيقات بسيطة وسريعة للموقع */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-container input {
            width: 80%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .playlist {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .song-item:last-child {
            border-bottom: none;
        }
        .song-info h4 {
            margin: 0;
            color: #2c3e50;
        }
        .song-info p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #7f8c8d;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219150;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            padding: 15px;
            text-align: center;
        }
        audio {
            width: 80%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <header>
        <h1>مكتبة الأناشيد الإسلامية</h1>
        <p>أناشيد قديمة وجديدة بدون إيقاع</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterSongs()" placeholder="ابحث عن نشيد أو منشد...">
    </div>

    <div class="playlist" id="songList">
        <!-- النشيد الأول -->
        <div class="song-item">
            <div class="song-info">
                <h4>فرش التراب</h4>
                <p>المنشد: مشاري العرادة</p>
            </div>
            <!-- ضع رابط ملف الصوت هنا -->
            <button onclick="playSong('https://example.com/song1.mp3', 'فرش التراب - مشاري العرادة')">تشغيل ▶</button>
        </div>

        <!-- النشيد الثاني -->
        <div class="song-item">
            <div class="song-info">
                <h4>سوف نبقى هنا</h4>
                <p>المنشد: رامي محمد</p>
            </div>
            <button onclick="playSong('https://example.com/song2.mp3', 'سوف نبقى هنا - رامي محمد')">تشغيل ▶</button>
        </div>
    </div>

    <!-- مشغل الصوتيات الثابت في الأسفل -->
    <div class="player-bar">
        <span id="currentSongTitle" style="color: white; display: block; margin-bottom: 5px;">اختر نشيداً للاستماع</span>
        <audio id="audioPlayer" controls>
            متصفحك لا يدعم مشغل الصوتيات.
        </audio>
    </div>

    <script>
        // دالة تشغيل النشيد
        function playSong(url, title) {
            var player = document.getElementById('audioPlayer');
            var titleDisplay = document.getElementById('currentSongTitle');
            player.src = url;
            titleDisplay.innerText = "جاري تشغيل: " + title;
            player.play();
        }

        // دالة البحث في القائمة
        function filterSongs() {
            var input = document.getElementById('searchInput');
            var filter = input.value.toLowerCase();
            var playlist = document.getElementById('songList');
            var items = playlist.getElementsByClassName('song-item');

            for (var i = 0; i < items.length; i++) {
                var text = items[i].innerText;
                if (text.toLowerCase().indexOf(filter) > -1) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
